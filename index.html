<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>电气工程师养成</title>
<style>
:root{
    --bg:#f2f2f7; --panel:#ffffff; --panel2:#f2f2f7; --panel3:#e9e9ef;
    --line:rgba(60,60,67,.14); --sep:rgba(60,60,67,.10);
    --txt:#1c1c1e; --sub:#8e8e93;
    --accent:#007aff; --accent2:#34c759; --gold:#ff9500; --danger:#ff3b30; --purple:#af52de;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --tabbar-bg:rgba(255,255,255,.86);
    --bg-fade:rgba(242,242,247,.85);
  }
  :root[data-theme="dark"]{
    --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --panel3:#3a3a3c;
    --line:rgba(255,255,255,.14); --sep:rgba(255,255,255,.10);
    --txt:#ffffff; --sub:#98989f;
    --accent:#0a84ff; --accent2:#30d158; --gold:#ff9f0a; --danger:#ff453a; --purple:#bf5af2;
    --shadow:none;
    --tabbar-bg:rgba(28,28,30,.82);
    --bg-fade:rgba(0,0,0,.85);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    line-height:1.5; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #view{position:absolute; inset:0 0 62px 0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .wrap{max-width:720px; margin:0 auto; padding:16px 14px 30px;}

  /* ==== 底部导航 ==== */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; height:62px; z-index:20;
    background:var(--tabbar-bg); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:.5px solid var(--line); display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--sub); font-family:inherit;
    font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; cursor:pointer; padding:0;
  }
  .tabbar button .ic{font-size:20px; line-height:1; filter:grayscale(1) opacity(.6);}
  .tabbar button.on{color:var(--accent);}
  .tabbar button.on .ic{filter:none;}

  /* ==== 通用 ==== */
  h2.sec{font-size:13px; color:var(--sub); margin:20px 4px 8px; font-weight:700; letter-spacing:.5px;}
  .card{background:var(--panel); border:.5px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:700;}
  .btn{background:var(--accent); color:#fff; padding:12px 16px; font-size:15px; border-radius:12px; font-weight:600;}
  .btn.wide{display:block; width:100%;}
  .btn.ghost{background:var(--panel3); color:var(--accent); border:none;}
  .switch{position:relative; display:inline-block; width:51px; height:31px; flex:0 0 auto;}
  .switch input{display:none;}
  .switch span{position:absolute; inset:0; background:#d9d9de; border-radius:31px; transition:.25s; cursor:pointer;}
  .switch span::before{content:''; position:absolute; width:27px; height:27px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.25s; box-shadow:0 2px 4px rgba(0,0,0,.18);}
  .switch input:checked + span{background:var(--accent2);}
  .switch input:checked + span::before{transform:translateX(20px);}
  :root[data-theme="dark"] .switch span{background:#48484a;}
  .setrow{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:.5px solid var(--sep); cursor:pointer;}
  .setrow .st{font-size:15px;}
  .setrow .ss{font-size:12px; color:var(--sub); margin-top:2px;}
  .kbsearch{display:flex; align-items:center; gap:8px; background:var(--panel); border:.5px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
  .kbsearch input{flex:1; min-width:0; border:none; background:transparent; color:var(--txt); font-size:15px; font-family:inherit; outline:none;}
  .kbsearch > span{color:var(--sub);}
  .kbsearch button{background:var(--panel3); color:var(--sub); width:24px; height:24px; border-radius:50%; font-size:12px; padding:0; flex:0 0 auto;}
  .kbrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:.5px solid var(--sep); cursor:pointer;}
  .kbrow:last-child{border-bottom:none;}
  .kbrow .kbt{font-size:14.5px;}
  .kbrow .kbc{font-size:11.5px; color:var(--sub); flex:0 0 auto;}
  .btn:disabled{opacity:.5; cursor:default;}
  .row{display:flex; align-items:center; gap:10px;}
  .bar{height:8px; border-radius:4px; background:var(--panel3); overflow:hidden; border:none;}
  .bar > i{display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s ease;}
  .muted{color:var(--sub);}
  .center{text-align:center;}

  /* ==== 主页 战力面板 ==== */
  .hero{
    background:var(--panel);
    border:.5px solid var(--line); border-radius:20px; padding:20px;
    box-shadow:var(--shadow);
  }
  .hero .t{font-size:19px; font-weight:800;}
  .hero .t small{display:block; color:var(--sub); font-weight:500; font-size:12px; margin-top:3px;}
  .rank-row{display:flex; align-items:center; gap:12px; margin-top:16px;}
  .rank-icon{font-size:38px;}
  .rank-name{font-size:20px; font-weight:700; color:var(--txt); letter-spacing:-.4px;}
  .rank-sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  .stat{background:var(--panel3); border:none; border-radius:12px; padding:10px 8px; text-align:center;}
  .stat b{display:block; font-size:18px; color:var(--txt);}
  .stat span{font-size:11px; color:var(--sub);}
  .today-tip{
    margin-top:14px; padding:13px 15px; border-radius:14px; font-size:13.5px;
    background:rgba(0,122,255,.12); background:color-mix(in srgb, var(--accent) 13%, transparent); border:none; color:var(--txt);
  }
  .today-tip b{color:var(--accent);}

  /* ==== 关卡卡片 ==== */
  .tier-label{margin:20px 4px 8px; font-size:12px; color:var(--sub); font-weight:700;}
  .lv{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line);
      border-radius:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;}
  .lv.locked{opacity:.5; cursor:default;}
  .lv-badge{width:42px; height:42px; flex:0 0 42px; border-radius:11px; display:flex; align-items:center;
      justify-content:center; font-weight:700; font-size:15px; background:var(--panel3); border:none;}
  .lv .info{flex:1; min-width:0;}
  .lv .info .t{font-size:14.5px; font-weight:700;}
  .lv .info .s{font-size:11.5px; color:var(--sub); margin:2px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-bar{height:5px; border-radius:3px; background:var(--panel3); overflow:hidden;}
  .mini-bar > i{display:block; height:100%; width:0; background:var(--accent2); transition:width .4s;}
  .pass-tag{font-size:10px; color:#06110a; background:var(--accent2); padding:2px 7px; border-radius:20px; font-weight:800; margin-left:6px;}

  /* ==== 详情页 ==== */
  .topbar{display:flex; align-items:center; gap:10px; padding:14px 4px 6px; position:sticky; top:0;
      background:linear-gradient(var(--bg), var(--bg-fade) 70%, transparent); z-index:5;}
  .back{background:var(--panel2); border:1px solid var(--line); color:var(--txt); width:38px; height:38px;
      border-radius:10px; font-size:18px; flex:0 0 38px;}
  .topbar .tt{font-size:16px; font-weight:800;}
  .topbar .ts{font-size:11.5px; color:var(--sub);}
  .teach{background:var(--panel3); border:none; border-radius:12px; padding:14px;
      font-size:13.5px; color:var(--txt); line-height:1.75;}
  .teach h4{margin:14px 0 6px; color:var(--accent); font-size:13.5px;}
  .teach h4:first-child{margin-top:0;}
  .teach b{color:var(--txt);}
  .teach code{background:var(--panel); padding:1px 6px; border-radius:5px; color:var(--accent); font-size:12.5px;}
  .teach ul{margin:4px 0; padding-left:20px;}
  .teach ol{margin:4px 0; padding-left:20px;}
  .teach p{margin:8px 0;}
  .teach p:first-child{margin-top:0;}
  .teach li{margin:3px 0;}
  .teach tip,.teach warn,.teach key{display:block; margin:8px 0; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.7; border-left:4px solid var(--accent);}
  .teach tip{background:rgba(52,199,89,.13); background:color-mix(in srgb, var(--accent2) 14%, transparent); border-left-color:var(--accent2);}
  .teach tip:before{content:'💡 ';}
  .teach key{background:rgba(0,122,255,.12); background:color-mix(in srgb, var(--accent) 13%, transparent); border-left-color:var(--accent);}
  .teach key:before{content:'🔑 ';}
  .teach warn{background:rgba(255,59,48,.12); border-left-color:var(--danger);}
  .teach warn:before{content:'⚠️ ';}
  .teach formula{display:block; margin:8px 0; padding:12px; text-align:center; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:13px; color:var(--accent); background:rgba(0,122,255,.10); background:color-mix(in srgb, var(--accent) 11%, transparent); border-radius:10px;}
  .dgx{margin:10px 0; padding:12px; background:var(--panel); border-radius:12px; border:.5px solid var(--line);}
  .dg-title{font-size:12px; font-weight:800; color:var(--accent); margin-bottom:8px;}
  .dg-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:5px 0;}
  .dg-chip{display:inline-block; padding:5px 10px; border-radius:8px; background:var(--panel3); font-size:12px; font-weight:600;}
  .dg-chip.hl{background:rgba(0,122,255,.16); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
  .dg-arrow{color:var(--sub); font-weight:800;}
  .dg-cap{font-size:11px; color:var(--sub); margin-top:5px; line-height:1.6;}
  .dg-vert{color:var(--sub); font-weight:800; margin:2px 0 2px 6px;}
  .palrow{display:flex; gap:14px; overflow-x:auto; padding:4px 0; align-items:center;}
  .pchip{width:38px; height:38px; flex:0 0 38px; border-radius:50%; border:none; cursor:pointer;}
  .pchip.on{outline:3px solid var(--txt); outline-offset:2px;}
  .task{display:flex; align-items:flex-start; gap:10px; padding:11px 4px; border-bottom:.5px solid var(--sep); cursor:pointer;}
  .task:last-child{border-bottom:none;}
  .task .box{width:22px; height:22px; flex:0 0 22px; border-radius:6px; border:2px solid var(--sub);
      display:flex; align-items:center; justify-content:center; margin-top:1px; font-size:13px; color:transparent; transition:.15s;}
  .task.done .box{background:var(--accent2); border-color:var(--accent2); color:#06110a;}
  .task .txt{flex:1; font-size:13.5px;}
  .task.done .txt{color:var(--sub); text-decoration:line-through;}
  .tag{font-size:10px; padding:1px 7px; border-radius:5px; margin-right:6px; font-weight:700;}
  .tag.x{background:rgba(0,122,255,.15); background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent);}
  .tag.p{background:rgba(175,82,222,.15); color:var(--purple);}
  .tag.pass{background:rgba(255,149,0,.18); color:var(--gold);}

  /* ==== 测验 ==== */
  .q{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .q .qt{font-size:14px; font-weight:700; margin-bottom:10px;}
  .opt{display:flex; align-items:flex-start; gap:9px; padding:10px 11px; border:1px solid var(--line); border-radius:10px;
      margin-bottom:7px; font-size:13px; cursor:pointer; background:var(--panel2);}
  .opt .dot{width:18px; height:18px; flex:0 0 18px; border-radius:50%; border:2px solid var(--sub);}
  .opt.sel{border-color:var(--accent); background:rgba(0,122,255,.12); background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .opt.sel .dot{background:var(--accent); border-color:var(--accent);}
  .opt.right{border-color:var(--accent2); background:rgba(52,199,89,.16);}
  .opt.right .dot{background:var(--accent2); border-color:var(--accent2);}
  .opt.wrong{border-color:var(--danger); background:rgba(255,59,48,.13);}
  .opt.wrong .dot{background:var(--danger); border-color:var(--danger);}
  .calc-row{display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:7px;}
  .calc-row input{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-size:15px; padding:8px 10px; font-family:inherit;}
  .calc-row input:focus{outline:none; border-color:var(--accent);}
  .calc-row .unit{color:var(--sub); font-size:13px;}
  .calc-row.right{border-color:var(--accent2); background:rgba(52,199,89,.16);}
  .calc-row.wrong{border-color:var(--danger); background:rgba(255,59,48,.13);}
  .calc-row .calc-ans{color:var(--accent2); font-size:12.5px; font-weight:700;}
  .kind{font-size:10px; padding:1px 6px; border-radius:5px; margin-right:6px; font-weight:700; vertical-align:1px; background:rgba(0,122,255,.15); background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent);}
  .explain{margin-top:8px; font-size:12.5px; color:var(--txt); background:rgba(255,149,0,.14); border:none;
      border-radius:10px; padding:9px 11px; display:none;}
  .result{font-size:18px; font-weight:800; text-align:center; padding:16px;}
  .result.good{color:var(--accent2);} .result.bad{color:var(--gold);}

  /* ==== 记录 ==== */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
  .cal .d{aspect-ratio:1; border-radius:7px; background:var(--panel3); border:none;
      display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--sub);}
  .cal .d.on{background:var(--accent2); color:#06110a; border-color:var(--accent2); font-weight:800;}
  .cal .d.today{outline:2px solid var(--accent); outline-offset:1px;}
  .ach{display:flex; gap:10px; align-items:center; padding:10px 4px; border-bottom:.5px solid var(--sep);}
  .ach:last-child{border-bottom:none;}
  .ach .ai{font-size:24px; filter:grayscale(1) opacity(.35);}
  .ach.got .ai{filter:none;}
  .ach .an{font-size:13.5px; font-weight:700;}
  .ach .ad{font-size:11.5px; color:var(--sub);}
  .xprow{display:flex; align-items:center; gap:10px; padding:8px 4px; font-size:12.5px;}
  .xprow .name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ==== 错题本 ==== */
  .wrongitem{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--danger);
      border-radius:12px; padding:12px; margin-bottom:10px;}
  .wrongitem .q{background:none; border:none; padding:0; margin:0;}
  .wrongitem .ans{font-size:13px; margin-top:6px;}
  .wrongitem .ans .ok{color:var(--accent2); font-weight:700;}
  .wrongitem .ans .no{color:var(--danger); text-decoration:line-through;}

  /* ==== 弹层 ==== */
  .toast{position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px);
      background:rgba(28,28,30,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:none; color:#fff; padding:11px 18px; border-radius:14px;
      font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.3s; z-index:99; max-width:90vw; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .levelup{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
      background:rgba(5,8,12,.82); backdrop-filter:blur(4px);}
  .levelup.show{display:flex; animation:fade .3s;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .levelup .box{text-align:center; padding:30px; animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{from{transform:scale(.6); opacity:0;}to{transform:scale(1); opacity:1;}}
  .levelup .big{font-size:64px; animation:spin 1s;}
  @keyframes spin{from{transform:rotate(-20deg) scale(.5);}to{transform:rotate(0) scale(1);}}
  .levelup .up1{font-size:14px; color:var(--gold); font-weight:800; letter-spacing:4px; margin-top:6px;}
  .levelup .up2{font-size:26px; font-weight:900; margin-top:6px; background:linear-gradient(90deg,#ffd25c,#ff9a3c);
      -webkit-background-clip:text; background-clip:text; color:transparent;}
  .levelup .up3{font-size:12.5px; color:var(--sub); margin-top:8px;}
  .levelup .btn{margin-top:20px;}
  .center-empty{text-align:center; color:var(--sub); padding:50px 20px; font-size:13.5px;}
  .center-empty .ic{font-size:40px; display:block; margin-bottom:10px; filter:grayscale(.4);}
</style>
</head>
<body>
<div id="view"></div>
<nav class="tabbar">
  <button data-tab="home"><span class="ic">🏠</span>主页</button>
  <button data-tab="map"><span class="ic">🗺️</span>地图</button>
  <button data-tab="kb"><span class="ic">📚</span>知识库</button>
  <button data-tab="wrong"><span class="ic">📕</span>错题本</button>
  <button data-tab="records"><span class="ic">📊</span>记录</button>
</nav>
<div class="toast" id="toast"></div>
<div class="levelup" id="levelup"></div>

<script>
/* ==================== 数据 ==================== */
const RANKS = [
  { min:0,    name:'见习电工',       icon:'🌱' },
  { min:200,  name:'熟练电工',       icon:'🔧' },
  { min:600,  name:'电气技术员',     icon:'⚡' },
  { min:1200, name:'电气工程师',     icon:'🎯' },
  { min:2000, name:'资深电气工程师', icon:'🏆' },
];
const TIERS = {
  green:  ['🟢 第一阶段 · 地基',         '#22c55e'],
  yellow: ['🟡 第二阶段 · 元件与硬逻辑', '#eab308'],
  red:    ['🔴 第三阶段 · 分水岭',       '#ef4444'],
  blue:   ['🔵 第四阶段 · PLC',          '#3ea6ff'],
  purple: ['🟣 第五阶段 · 高手进阶',     '#a855f7'],
};

const LEVELS = [
  { id:1, tier:'green', title:'电学基础', sub:'欧姆定律 · 功率 · 三相电', 
    teach:`
<h4>① 欧姆定律</h4>
<p>电流、电压、电阻三者相互制约,是整个电学的根。</p>
<formula>U = I × R</formula>
<ul>
<li><b>电压 U</b>(伏 V):推动电流的"压力"。</li>
<li><b>电流 I</b>(安 A):单位时间流过的电荷量。</li>
<li><b>电阻 R</b>(欧 Ω):对电流的阻碍。</li>
</ul>
<tip>记法:遮住要求的那个量,剩下两个的关系就是公式。求 I 遮 I → U/R;求 U 遮 U → I×R。</tip>

<h4>② 电功率与电能</h4>
<formula>P = U × I  (单相)</formula>
<formula>P = √3 × U线 × I × cosφ  (三相)</formula>
<ul>
<li>电能 W = P × t,1kWh = 一度电。</li>
<li>发热功率 P = I²R,与电流平方成正比 —— 这是过载发热的根源。</li>
</ul>

<h4>③ 串联与并联</h4>
<p><b>串联</b>:电流处处相同,电压按电阻分配,总电阻相加。</p>
<p><b>并联</b>:电压相同,电流按支路分配。</p>
<warn>别搞混:串联"分压不分流",并联"分流不分压"。两个相等电阻并联,总阻减半。</warn>

<h4>④ 三相电</h4>
<p>三相相位互差 120°,能产生旋转磁场。</p>
<formula>线电压 = √3 × 相电压  (380V / 220V)</formula>
<ul>
<li><b>星形(Y)</b>:线电压 380V,相电压 220V。</li>
<li><b>三角形(△)</b>:线电压 = 相电压。</li>
<li>三相电机比单相"劲儿大",就是因为旋转磁场让转矩更平稳。</li>
</ul>

<h4>⑤ 功率因数</h4>

    teach:`
<h4>① 断路器 QF</h4>
<p>手动分合 + 过载 / 短路保护,用于主回路总开关或支路。</p>
<ul><li>分 C 型(照明)、D 型(电机,抗启动冲击)。</li></ul>
<warn>断路器不是越大越好!选大了,过载/短路时不能及时跳闸,就失去了保护作用。</warn>

<h4>② 接触器 KM</h4>
<p>用线圈小电流控制主触点大电流,可频繁通断。</p>
<ul><li>主触点接主回路;辅助触点(常开/常闭)接控制回路。</li><li>选型看负载电流/功率、使用类别、通断频次。</li></ul>
<tip>接触器"能频繁通断"靠的是电磁吸合 —— 线圈通电吸合、断电释放。</tip>

<h4>③ 热继电器 FR</h4>
<p>电机过载保护:双金属片受热变形,超过整定值推动常闭触点断开控制回路。</p>
<key>整定电流 ≈ 电机额定电流;过载动作后可手动复位。</key>
<warn>热继不做短路保护 —— 短路太快,热元件来不及动作,靠断路器/熔断器。</warn>

<h4>④ 中间继电器 KA</h4>
<p>用于信号传递、触点扩展、逻辑隔离;触点容量小,不能直接驱动大负载。</p>

<h4>⑤ 按钮与指示灯</h4>
<ul><li>启动按钮用<b>常开</b>(按下接通)。</li><li>停止按钮用<b>常闭</b>(串在回路,按下断开)。</li></ul>
<tip>停止按钮为什么用常闭?断线时也能停,更安全 —— 这叫"失效安全"。</tip>

<h4>⑥ 接近开关 / 熔断器</h4>
<ul><li>接近开关:非接触检测位置,无磨损;输出分 NPN/PNP,接 PLC 注意极性。</li><li>熔断器 FU:短路保护,一次性,熔断后需更换。</li></ul>

    teach:`
<h4>① 启保停(自锁)⭐</h4>
<p>电工转工程师的第一道门 —— 它和 PLC 逻辑完全相通。</p>
<diagram id="hold"/>
<ul>
<li>按下启动 SB2 → 接触器 KM 得电 → KM 常开辅助触点闭合"锁住"自己 → 松手仍通电。</li>
<li>停止 SB1 用常闭串联,按下即断开回路。</li>
</ul>
<key>结构 = 启动(常开)∥ 自锁(常开),再串停止(常闭)。</key>

<h4>② 互锁</h4>
<p>两个接触器不能同时吸合(会短路),各串入对方的常闭触点。</p>

<h4>③ 正反转</h4>
<diagram id="fwdrev"/>
<ul><li>交换任意两相实现反转。</li><li>必须电气互锁 + 机械互锁,防止同时吸合造成相间短路。</li></ul>

<h4>④ 星三角降压启动</h4>
<p>启动时绕组接星形,相电压降到 1/√3,启动电流降到约 1/3;延时后切换成三角全压运行。</p>
<tip>适合轻载 / 空载启动的大功率电机,减小对电网的冲击。</tip>

<h4>⑤ 顺序控制</h4>
<p>用前一步的完成信号(限位 / 定时 / 传感器)启动下一步,可逆序停机形成连锁。</p>
<warn>顺序控制最怕"跳步、乱步" —— 每步必须有明确的转入 / 转出条件。</warn>

<h4>① 电机额定电流</h4>
<formula>I = P / (√3 × U × cosφ × η)</formula>
<ul><li>经验:380V 电机"1kW ≈ 2A"。</li><li>例:7.5kW、cosφ 0.85、η 0.9 → I ≈ 15A。</li></ul>

<h4>② 导线截面积与载流量</h4>
<ul>
<li>按<b>载流量</b>选截面积,再校核压降与短路热稳定。</li>
<li>参考:1.5mm²≈10A,2.5mm²≈16-20A,4mm²≈25A,6mm²≈32A(以手册为准)。</li>
</ul>

<h4>③ 线路压降</h4>
<formula>ΔU ≈ I × R线路  (单相往返要 ×2)</formula>
<key>一般要求末端压降 ≤ 5%。线越长、电流越大、线越细,压降越大。</key>

<h4>④ 断路器与接触器选型</h4>
<ul>
<li>断路器:额定电流略大于负载电流(电机取 1.2~1.5 倍并配合启动方式),同时满足短路分断能力。</li>
<li>接触器:按负载功率 / 电流、使用类别(AC-3 电机)、通断频率选。</li>
</ul>
<warn>过大会失去保护,过小会频繁误跳 —— 要匹配,不是越大越好。</warn>

<h4>⑤ 短路电流</h4>
<p>用于校核保护电器的分断能力和电缆热稳定,并做上、下级选择性配合。</p>

  { id:6, tier:'blue', title:'PLC 入门', sub:'硬件结构 · 扫描机制 · 梯形图', 
    teach:`
<h4>① PLC 是什么</h4>
<p>可编程逻辑控制器:用程序实现控制逻辑,替代继电器盘。</p>
<ul><li>构成:电源、CPU、输入模块、输出模块、通讯口。</li><li>输入(X/%I)、输出(Y/%Q)、中间(M)、定时(T)、计数(C)。</li></ul>

<h4>② 扫描机制(核心)</h4>
<diagram id="scan"/>
<key>循环执行:输入采样 → 程序执行 → 输出刷新,周期只有几毫秒。</key>
<p>程序读的是输入映像区快照,保证同一周期内逻辑一致。</p>

<h4>③ 梯形图与继电逻辑对应</h4>
<ul>
<li>按钮 / 开关 → 输入触点(X)。</li>
<li>接触器线圈 / 灯 → 输出线圈(Y)。</li>
<li>自锁 → 输出线圈的常开触点并联启动触点。</li>
</ul>
<diagram id="hold"/>

<h4>④ 为什么用 PLC</h4>
<tip>改逻辑只需改程序,不用改接线;还能通讯组网、处理复杂逻辑,可靠性也更高。</tip>

<h4>① 定时器与计数器</h4>

<diagram id="pid"/>

    { id:'k-power', t:'电功率与电能', kw:'功率 电能 kWh 瓦 度 P UI', body:`<p><b>电功率</b>:P = U × I(瓦)。<b>电能</b> W = P × t,1kWh = 一度电。</p><ul><li>单相:220V×10A = 2200W = 2.2kW。</li><li>三相:P=√3×U线×I×cosφ。</li><li>发热功率 P=I²R,与电流平方成正比。</li></ul>` },
    { id:'k-sp', t:'串联与并联', kw:'串并联 串联 并联 电阻', body:`<p><b>串联</b>:电流相同,电压分配,总电阻相加 R=R1+R2。</p><p><b>并联</b>:电压相同,电流分配,1/R=1/R1+1/R2;两个相等电阻并联后减半。</p><ul><li>串联一处断全断;并联各支路独立。</li></ul>` },
    { id:'k-acdc', t:'直流与交流', kw:'直流 交流 DC AC 有效值 峰值 频率', body:`<ul><li><b>直流(DC)</b>:方向不变,如电池、开关电源输出。</li><li><b>交流(AC)</b>:方向周期变化,中国工频 50Hz。</li><li>交流有<b>有效值</b>(220V 即有效值),峰值≈1.414×有效值。</li></ul>` },
    { id:'k-3phase', t:'三相电入门', kw:'三相 线电压 相电压 星形 三角 380 220', body:`<p>三相电三根相线相位互差 120°。<b>线电压</b>=√3×<b>相电压</b>(380V×220V)。</p><ul><li>星形(Y):线电压 380,相电压 220。</li><li>三角形(△):线电压=相电压。</li><li>三相能产生旋转磁场,驱动三相电机,转矩平稳。</li></ul>` },
    { id:'k-pf', t:'功率因数与无功补偿', kw:'功率因数 cosφ 无功 补偿 电容', body:`<p><b>功率因数 cosφ</b> = 有功 / 视在。越低,无功越多,供电效率越差。</p><ul><li>感性负载(电机、变压器)拉低 cosφ。</li><li>补偿:并联电容器就地补偿。</li><li>电压×电流=视在功率,再乘 cosφ 才是有功。</li></ul>` },
  ]},
  { id:'draw', icon:'📐', name:'识图与符号', items:[
    { id:'k-symbol', t:'常用电气符号速查', kw:'符号 QF KM FR KA SB KT 线圈 触点', body:`<ul><li>QF 断路器,KM 接触器,FR 热继电器,KA 中间继电器,SB 按钮,KT 时间继电器,M 电机,HL 指示灯,QS 隔离开关,FU 熔断器,TA 电流互感器。</li><li>触点:常开 NO(断开)、常闭 NC(带斜线)。</li><li>线圈用方框表示。</li></ul>` },
    { id:'k-mainctl', t:'主回路与控制回路', kw:'主回路 控制回路 大电流 小电流', body:`<ul><li><b>主回路</b>:电源→断路器→接触器主触点→热继→电机,走大电流。</li><li><b>控制回路</b>:按钮、线圈、辅助触点,走小电流,决定主回路通断。</li></ul>` },
    { id:'k-dgtypes', t:'系统图/原理图/接线图', kw:'系统图 原理图 接线图 端子图', body:`<ul><li><b>系统图</b>:整体供电结构关系(宏观)。</li><li><b>原理图</b>:控制逻辑,谁控制谁。</li><li><b>接线图/端子图</b>:现场实际接线位置(线号、端子号)。</li></ul>` },
    { id:'k-read', t:'怎样读一张控制原理图', kw:'读图 识图 方法 步骤', body:`<ol><li>先看主回路:电机、断路器、接触器、热继。</li><li>再看控制回路:谁给线圈供电,串了哪些保护触点。</li><li>找自锁、互锁、停止、急停。</li><li>最后对照 I/O 表或元件表确认。</li></ol>` },
    { id:'k-wireno', t:'线号与端子编号', kw:'线号 端子号 线色 编号', body:`<ul><li>线号唯一标识一根线,端子号标识接点位置。</li><li>同一根线两端线号相同,便于排查。</li><li>线色约定:黄绿双色=保护接地 PE,一般不作相线。</li></ul>` },
  ]},
  { id:'device', icon:'🔌', name:'低压电器元件', items:[
    { id:'k-qf', t:'断路器 QF', kw:'断路器 空开 过载 短路 分断', body:`<p>断路器(QF):手动分合 + 过载/短路保护。</p><ul><li>用于主回路总开关或支路。</li><li>有 C 型(照明)、D 型(电机,抗启动冲击)。</li><li>不是越大越好,要与负载匹配。</li></ul>` },
    { id:'k-km', t:'接触器 KM', kw:'接触器 线圈 主触点 辅助触点 频繁', body:`<p>接触器(KM):线圈小电流控制主触点大电流,可频繁通断。</p><ul><li>主触点接主回路;辅助触点(常开/常闭)接控制回路。</li><li>选型看负载电流/功率、使用类别、通断频次。</li></ul>` },
    { id:'k-fr', t:'热继电器 FR', kw:'热继电器 过载 整定 双金属片', body:`<p>热继电器(FR):电机过载保护。</p><ul><li>双金属片受热变形,超过整定值推动常闭触点断开控制回路。</li><li>整定电流≈电机额定电流;过载动作后可手动复位。</li><li>不做短路保护(短路靠断路器/熔断器)。</li></ul>` },
    { id:'k-ka', t:'中间继电器 KA', kw:'中间继电器 信号 触点扩展 隔离', body:`<p>中间继电器(KA):信号传递、触点扩展、逻辑隔离。</p><ul><li>触点容量小,不能直接驱动大负载,常用于控制接触器线圈或传递信号。</li></ul>` },
    { id:'k-btn', t:'按钮与指示灯', kw:'按钮 常开 常闭 指示灯 启动 停止', body:`<ul><li>启动按钮用<b>常开</b>(按下接通)。</li><li>停止按钮用<b>常闭</b>(串在回路,按下断开),断线也能停更安全。</li><li>指示灯做状态反馈:运行绿、停止红、报警黄等。</li></ul>` },
    { id:'k-sensor', t:'接近开关与传感器', kw:'接近开关 传感器 NPN PNP 光电 电感', body:`<ul><li>接近开关:非接触检测位置,无磨损、寿命长。</li><li>分电感式(金属)、电容式(多种)、光电式。</li><li>输出分 NPN/PNP,接 PLC 输入要注意极性。</li></ul>` },
    { id:'k-fuse', t:'熔断器 FU', kw:'熔断器 保险 短路', body:`<ul><li>熔断器(FU):短路保护,靠熔丝熔断。</li><li>一次性,熔断后需更换;常与断路器配合。</li></ul>` },
  ]},
  { id:'logic', icon:'🧩', name:'继电控制逻辑', items:[
    { id:'k-hold', t:'启保停(自锁)', kw:'启保停 自锁 启动 停止', body:`<p><b>启保停(自锁)</b>:按下启动 SB2 → 接触器 KM 得电 → KM 常开辅助触点闭合“锁住”自己 → 松手仍通电。</p><ul><li>停止 SB1 用常闭串联,按下断开回路即停。</li><li>口诀:启动(常开)∥自锁(常开),再串停止(常闭)。</li></ul>` },
    { id:'k-interlock', t:'互锁', kw:'互锁 连锁 短路 防止同时', body:`<p><b>互锁</b>:两个接触器不能同时吸合(会短路),各串入对方常闭触点。</p><ul><li>再加机械互锁(双方机械卡扣)更可靠。</li></ul>` },
    { id:'k-fwdrev', t:'电机正反转', kw:'正反转 换相 互锁 KM1 KM2', body:`<ul><li>用两个接触器 KM1(正转)、KM2(反转),交换任意两相实现反转。</li><li>必须电气互锁 + 机械互锁,防止同时吸合造成相间短路。</li></ul>` },
    { id:'k-stardelta', t:'星三角降压启动', kw:'星三角 降压启动 启动电流 时间继电器', body:`<ul><li>启动时绕组接星形,相电压降为 1/√3,启动电流降到约 1/3。</li><li>延时(时间继电器)后切换成三角全压运行。</li><li>适合轻载/空载启动的大功率电机。</li></ul>` },
    { id:'k-seq', t:'顺序控制与连锁', kw:'顺序 连锁 步序 完成信号', body:`<ul><li>用前一步的完成信号(限位、定时、传感器)去启动下一步。</li><li>停机可逆序,形成连锁。</li><li>核心:每步有明确的转入/转出条件,防止跳步、乱步。</li></ul>` },
    { id:'k-jog', t:'点动控制', kw:'点动 微调 无自锁', body:`<ul><li>点动:按住才动,松开即停(无自锁)。</li><li>常用于对刀、调试、微调位置。</li></ul>` },
  ]},
  { id:'calc', icon:'🧮', name:'计算与选型', items:[
    { id:'k-motor-i', t:'电机额定电流计算', kw:'电机 额定电流 公式 功率', body:`<p>三相电机额定电流:</p><p><code>I = P / (√3 × U × cosφ × η)</code></p><ul><li>经验“1kW≈2A”(380V)。</li><li>例:7.5kW、cosφ0.85、η0.9 → I≈15A。</li></ul>` },
    { id:'k-wire', t:'导线截面积与载流量', kw:'线径 截面积 载流量 平方 铜线', body:`<ul><li>按<b>载流量</b>选截面积(与敷设方式、环境温度、并敷根数有关)。</li><li>参考:1.5mm²≈10A,2.5mm²≈16-20A,4mm²≈25A,6mm²≈32A(仅参考,以手册为准)。</li><li>再校核压降与短路热稳定。</li></ul>` },
    { id:'k-vdrop', t:'线路压降', kw:'压降 电压损失 距离 ΔU', body:`<p>线路压降 ΔU ≈ I × R线路(单相往返要乘 2)。</p><ul><li>一般要求末端压降 ≤5%。线越长、电流越大、线越细,压降越大。</li></ul>` },
    { id:'k-breaker', t:'断路器选型', kw:'断路器 选型 整定 倍数', body:`<ul><li>额定电流略大于负载电流(电机取 1.2~1.5 倍并配合启动)。</li><li>还要满足短路分断能力 ≥ 安装处短路电流。</li><li>过大会失去保护,过小会频繁误跳。</li></ul>` },
    { id:'k-contactor', t:'接触器与热继选型', kw:'接触器 热继 选型 使用类别 AC-3', body:`<ul><li>接触器按负载功率/电流等级、使用类别(AC-3 电机)、通断频率选。</li><li>热继整定≈电机额定电流;三角启动内侧热继注意接法。</li></ul>` },
    { id:'k-short', t:'短路电流与保护配合', kw:'短路电流 分断能力 选择性 配合', body:`<ul><li>短路电流用于选保护电器的分断能力和校核电缆热稳定。</li><li>需配合:上、下级保护有选择性,避免一起跳。</li></ul>` },
  ]},
  { id:'plc', icon:'🖥️', name:'PLC 可编程控制器', items:[
    { id:'k-plc-what', t:'PLC 是什么', kw:'PLC 构成 输入 输出 CPU 模块', body:`<p>PLC(可编程逻辑控制器):用程序实现控制逻辑,替代继电器盘。</p><ul><li>构成:电源、CPU、输入模块、输出模块、通讯口。</li><li>输入(X/%I)、输出(Y/%Q)、中间(M)、定时(T)、计数(C)。</li></ul>` },
    { id:'k-plc-scan', t:'扫描机制', kw:'扫描 周期 采样 刷新 映像区', body:`<p>循环执行:<b>输入采样 → 程序执行 → 输出刷新</b>,周期几毫秒。</p><ul><li>程序读的是输入映像区快照,保证同周期逻辑一致。</li></ul>` },
    { id:'k-plc-ladder', t:'梯形图基础', kw:'梯形图 触点 线圈 自锁 常闭', body:`<ul><li>触点、线圈、并串联,和继电器逻辑一一对应。</li><li>自锁:输出常开触点并联启动触点。</li><li>常闭触点用于停止、互锁(信号 0 时导通)。</li></ul>` },
    { id:'k-plc-timer', t:'定时器与计数器', kw:'定时器 计数器 TON TOF CTU CTD', body:`<ul><li>TON 通电延时、TOF 断电延时、TP 脉冲。</li><li>CTU 加计数、CTD 减计数。</li><li>定时时间=设定值×时基。</li></ul>` },
    { id:'k-plc-state', t:'顺序/状态机控制', kw:'状态机 步序 流程 超时', body:`<ul><li>用“步(Step)”描述流程,当前步满足条件才进下一步。</li><li>每步设超时监控,避免卡死。</li><li>工业控制最常用、最清晰的写法。</li></ul>` },
    { id:'k-plc-analog', t:'模拟量处理', kw:'模拟量 4-20mA 0-10V 量程 换算', body:`<ul><li>信号:4-20mA、0-10V、0-20mA;对应工程量(温度/压力/频率)。</li><li>4mA 常为量程下限(活零点),便于断线检测。</li><li>工程量=(原始值-下限)/(上限-下限)×量程范围。</li></ul>` },
    { id:'k-plc-pid', t:'PID 入门', kw:'PID 比例 积分 微分 超调 稳态', body:`<ul><li>P 比例:按偏差响应,快但可能超调。</li><li>I 积分:消除稳态误差。</li><li>D 微分:抑制超调、预判趋势。</li><li>温控、压力、流量常用;整定可从 P 起。</li></ul>` },
    { id:'k-plc-brand', t:'常用品牌与软件', kw:'西门子 三菱 AB CODESYS TIA 博途', body:`<ul><li>西门子:S7-1200/1500,TIA Portal(博途),SCL/梯形图。</li><li>罗克韦尔(AB):Studio 5000,梯形图/ST。</li><li>三菱 GX Works;欧姆龙 Sysmac;施耐德 EcoStruxure;倍福 TwinCAT。</li><li>通用/开源:CODESYS、OpenPLC。</li></ul>` },
  ]},
  { id:'drive', icon:'⚙️', name:'变频器与传动', items:[
    { id:'k-vfd', t:'变频器原理与 V/F', kw:'变频器 V/F 频率 调速 磁饱和', body:`<ul><li>改变供电频率调速,保持 V/F 恒定。</li><li>低频时电压也降低,避免磁饱和。</li></ul>` },
    { id:'k-vfd-param', t:'变频器参数设置', kw:'参数 加速 减速 转矩提升 保护', body:`<ul><li>关键参数:额定电压/电流/频率、上限频率、加速/减速时间、转矩提升、保护。</li><li>加速时间太短易跳过流,太长影响效率。</li><li>普通电机低速自冷差,长时间低速要散热。</li></ul>` },
    { id:'k-vfd-speed', t:'多段速与模拟量调速', kw:'多段速 模拟量 给定 端子', body:`<ul><li>多段速:几个数字端子组合选固定频率档。</li><li>模拟量 0-10V/4-20mA:连续无级调速。</li><li>通讯给定:通过 Modbus/Profinet 写频率。</li></ul>` },
    { id:'k-servo', t:'伺服与步进', kw:'伺服 步进 闭环 开环 编码器 定位', body:`<ul><li>伺服:闭环控制位置/速度/转矩,带编码器,精度高。</li><li>步进:开环,便宜,可能丢步。</li><li>常用于定位、同步、精密运动。</li></ul>` },
    { id:'k-brake', t:'制动与刹车', kw:'制动 刹车 电阻 抱闸', body:`<ul><li>减速停车、制动电阻消耗再生能量。</li><li>机械抱闸用于断电保持位置。</li></ul>` },
  ]},
  { id:'comm', icon:'🌐', name:'通讯与上位机', items:[
    { id:'k-modbus', t:'Modbus 入门', kw:'Modbus 主从 RS485 通讯', body:`<ul><li>最通用的工业协议,主从结构。</li><li>物理层常 RS-485 或以太网(Modbus TCP)。</li><li>报文:站号+功能码+数据+CRC。</li></ul>` },
    { id:'k-modbus-f', t:'功能码与报文', kw:'功能码 03 06 10 报文 寄存器', body:`<ul><li>01 读线圈、02 读离散输入、03 读保持寄存器、04 读输入寄存器。</li><li>05 写单线圈、06 写单寄存器、10 写多寄存器。</li><li>寄存器地址分 0x/1x/3x/4x 区。</li></ul>` },
    { id:'k-fieldbus', t:'Profinet / EtherNet-IP', kw:'Profinet EtherNet IP EtherCAT 工业以太网', body:`<ul><li>Profinet(西门子系)、EtherNet/IP(AB 系)、EtherCAT(倍福系)。</li><li>工业以太网,实时性强,用于设备高速组网。</li></ul>` },
    { id:'k-hmi', t:'HMI 组态要点', kw:'HMI 触摸屏 组态 画面 变量', body:`<ul><li>控件绑定 PLC 变量地址,实现操作与显示。</li><li>画面结构:主画面、参数、报警、趋势。</li></ul>` },
    { id:'k-scada', t:'上位机与 SCADA', kw:'SCADA 上位机 监控 报表 OPC', body:`<ul><li>上位机/SCADA:集中监控、数据记录、报警、报表。</li><li>架构:现场设备→PLC→上位机,常用 OPC、数据库。</li></ul>` },
    { id:'k-comm-debug', t:'通讯排错', kw:'通讯 排错 分层 波特率 站号', body:`<ul><li>分层排查:物理层(接线/供电)→参数(波特率/站号/校验)→协议→应用。</li><li>先确认线、再确认参数,最后看数据。</li></ul>` },
  ]},
  { id:'safety', icon:'🦺', name:'安全与规范', items:[
    { id:'k-ground', t:'接地与保护接地', kw:'接地 PE 漏电 黄绿双色', body:`<ul><li>PE 保护接地:设备外壳接地,漏电时快速跳闸。</li><li>黄绿双色线专用于 PE。</li><li>接地电阻要满足规范要求。</li></ul>` },
    { id:'k-estop', t:'安全回路与急停', kw:'急停 安全回路 硬线 常闭 复位', body:`<ul><li>急停接<b>硬线安全回路</b>,直接切断危险动力,用常闭触点。</li><li>手动复位(锁定式),不能自动恢复。</li><li>不能只靠 PLC(PLC 也可能故障)。</li></ul>` },
    { id:'k-failsafe', t:'失效安全原则', kw:'失效安全 常闭 断线 安全状态', body:`<ul><li>失效安全:元件故障时系统进入安全状态(如断电即停)。</li><li>安全回路用常闭串联(断线=安全)。</li></ul>` },

/* ==================== 测验选项打乱 ==================== */
let quizOrder={};
function refreshQuizOrder(id){
  quizOrder={};
  const lv=LEVELS.find(l=>l.id===id); if(!lv) return;
  lv.quiz.forEach((q,qi)=>{
    if(q.options&&q.options.length){
      const a=q.options.map((_,i)=>i);
      for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
      quizOrder[qi]=a;
    }
  });
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ==================== 计算 ==================== */
function correctCount(){ let n=0; Object.values(state.quiz).forEach(o=>{ n += (o.correct||0); }); return n; }
function quizAttempted(){ return Object.values(state.quiz).reduce((a,o)=>a+(o.attempted||0),0); }
function totalXP(){
  let xp=0;
  LEVELS.forEach(lv=> lv.tasks.forEach((t,i)=>{ if(state.done[`L${lv.id}-${i}`]) xp+=t.xp; }));
  xp += correctCount()*8;          // 答对一题 8 XP
  xp += (state.checkin.streak||0)*5; // 每天连续奖励
  return xp;
}
function levelDone(lv){ return lv.tasks.every((t,i)=> state.done[`L${lv.id}-${i}`]); }
function levelTaskProg(lv){ return lv.tasks.filter((t,i)=> state.done[`L${lv.id}-${i}`]).length / lv.tasks.length; }
function levelQuizDone(lv){ const o=state.quiz[lv.id]; return o && o.attempted>=lv.quiz.length; }
function passedCount(){ return LEVELS.filter(levelDone).length; }
function rankIndex(xp){ let idx=0; RANKS.forEach((r,i)=>{ if(xp>=r.min) idx=i; }); return idx; }
function isUnlocked(idx){ return idx===0 || levelDone(LEVELS[idx-1]); }
function currentLevelIdx(){ const i=LEVELS.findIndex(lv=>!levelDone(lv)); return i<0?LEVELS.length-1:i; }

/* ==================== 音效 ==================== */
let actx=null;
function beep(freq, dur, type){
  if(!state.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.15, actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function sfxTask(){ beep(660,.12); }
function sfxLevel(){ beep(523,.15); setTimeout(()=>beep(659,.15),140); setTimeout(()=>beep(784,.28),290); }

  if(v==='quiz'){ quizSel={}; quizSubmitted=false; refreshQuizOrder(p); }
  if(v!=='detail'&&v!=='quiz'&&v!=='article'){ prevView=v; }
  view=v; viewParam=p; document.getElementById('view').scrollTop=0; render();
}
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=> go(b.dataset.tab));
});

function setTabs(){
  let active = view;
  if(view==='detail'||view==='quiz') active='map';
  else if(view==='article') active='kb';
  document.querySelectorAll('.tabbar button').forEach(b=> b.classList.toggle('on', b.dataset.tab===active));
}

/* ==================== 渲染主入口 ==================== */
function render(){
  const before = rankIndex(totalXP());
  const el=document.getElementById('view');
  if(view==='home') el.innerHTML=viewHome();
  else if(view==='map') el.innerHTML=viewMap();
  else if(view==='detail') el.innerHTML=viewDetail(viewParam);
  else if(view==='quiz') el.innerHTML=viewQuiz(viewParam);
  else if(view==='wrong') el.innerHTML=viewWrong();
  else if(view==='records') el.innerHTML=viewRecords();
  else if(view==='kb') el.innerHTML=viewKnowledge();
  else if(view==='article') el.innerHTML=viewArticle(viewParam);
  setTabs();
  wire();
  const after = rankIndex(totalXP());
  if(after>before && view!=='quiz'){ showLevelUp(after); }
  else if(after>before){ state.rankIdx=after; save(); }
}

}

function viewDetail(id){
  const lv=LEVELS.find(l=>l.id===id); if(!lv) return `<div class="wrap"><div class="center-empty">未找到</div></div>`;
  const done=levelDone(lv);
  const qdone=levelQuizDone(lv);
  const o=state.quiz[lv.id]||{};
  let tasks='';
  lv.tasks.forEach((t,i)=>{
    const d=state.done[`L${lv.id}-${i}`];
    const cls=t.type==='学'?'x':(t.type==='练'?'p':'pass');
    tasks+=`<div class="task ${d?'done':''}" data-task="${i}">
      <div class="box">✓</div>
      <div class="txt"><span class="tag ${cls}">${t.type}</span>${t.text}
        <span class="muted" style="font-size:11px"> +${t.xp}XP</span></div></div>`;
  });
  return `<div class="wrap">
    <div class="topbar">
      <button class="back" id="backBtn">‹</button>
      <div><div class="tt">Lv${lv.id} ${lv.title}</div><div class="ts">${lv.sub}</div></div>
    </div>
    <h2 class="sec">📖 知识点讲解</h2>
    <div class="teach">${teachHtml(lv.teach)}</div>
    <h2 class="sec">✅ 任务清单</h2>
    <div class="card" style="padding:4px 14px">${tasks}</div>
    ${done?`<div class="result good" style="font-size:14px">🎉 本关任务已完成${qdone?'':',再做个测验更扎实'}</div>`:''}
    <h2 class="sec">🧠 闯关测验</h2>
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div style="font-size:13.5px;font-weight:700">${lv.quiz.length} 道题 · 自动判分</div>
          <div class="muted" style="font-size:11.5px">${qdone?`已作答 · 答对 ${o.correct||0}/${lv.quiz.length}`:'答对每题 +8 XP'}</div>
        </div>
        <button class="btn" data-go="quiz" data-p="${lv.id}">${qdone?'重做':'开始测验'}</button>
      </div>
    </div>
    <div style="height:20px"></div>
  </div>`;
}

/* -------- 测验 -------- */
let quizSel={}, quizSubmitted=false;
function isCorrect(q,val){
  if(q.type==='calc'){ const n=parseFloat(val); return !isNaN(n) && Math.abs(n-q.answer)<=(q.tol!=null?q.tol:0.01); }
  return val===q.answer;
}
function viewQuiz(id){
  const lv=LEVELS.find(l=>l.id===id); if(!lv) return `<div class="wrap"><div class="center-empty">未找到</div></div>`;
  const qs=lv.quiz;
  let body='';
  qs.forEach((q,qi)=>{
    let opts='';
    if(q.type==='calc'){
      const val=quizSel[qi];
      let cls='';
      if(quizSubmitted){ cls = isCorrect(q,val) ? 'right' : 'wrong'; }
      opts=`<div class="calc-row ${cls}">
        <input type="number" inputmode="decimal" step="any" data-calc="${qi}" value="${val!=null?val:''}" placeholder="填数值" ${quizSubmitted?'disabled':''}>
        <span class="unit">${q.unit||''}</span>
        ${quizSubmitted?`<span class="calc-ans">正确:${q.answer}${q.unit||''}</span>`:''}
      </div>`;
    } else {
      const order = quizOrder[qi] || q.options.map((_,i)=>i);
      order.forEach(oi=>{
        const op=q.options[oi];
        let cls='';
        const sel=quizSel[qi];
        if(quizSubmitted){
          if(oi===q.answer) cls='right';
          else if(oi===sel) cls='wrong';
        } else if(sel===oi){ cls='sel'; }
        opts+=`<div class="opt ${cls}" data-q="${qi}" data-o="${oi}"><span class="dot"></span><span>${op}</span></div>`;
      });
    }
    const kindTag = q.type==='calc' ? '🧮 计算' : (q.kind==='logic' ? '🧠 逻辑' : '📘 概念');
    body+=`<div class="q">
      <div class="qt"><span class="kind">${kindTag}</span>${qi+1}. ${q.q}</div>
      ${opts}
      <div class="explain" id="exp-${qi}" style="${quizSubmitted?'display:block':''}">💡 ${q.explain}</div>
    </div>`;
  });
  const answered=qs.filter((q,qi)=>{ const v=quizSel[qi]; return v!==undefined && v!==null && v!==''; }).length;
  let resultHtml='';
  if(quizSubmitted){
    const right=qs.filter((q,qi)=>isCorrect(q,quizSel[qi])).length;
    resultHtml=`<div class="result ${right===qs.length?'good':'bad'}">得分 ${right}/${qs.length} ${right===qs.length?'🎉 全对!':'继续加油'}</div>`;
  }
  return `<div class="wrap">
    <div class="topbar">
      <button class="back" id="backBtn">‹</button>
      <div><div class="tt">Lv${lv.id} 闯关测验</div><div class="ts">答对每题 +8 XP · 错题自动进错题本</div></div>
    </div>
    ${resultHtml}
    ${body}
    ${quizSubmitted
      ? `<button class="btn wide" id="quizAgain">再做一次</button>`
      : `<button class="btn wide" id="quizSubmit" ${answered<qs.length?'disabled':''}>交卷判分 (${answered}/${qs.length})</button>`}
    <div style="height:20px"></div>
  </div>`;
}

/* -------- 错题本 -------- */
function viewWrong(){
  const keys=Object.keys(state.wrong);
  if(!keys.length) return `<div class="wrap"><div class="center-empty"><span class="ic">✨</span>错题本是空的<br><span style="font-size:12px">做测验答错的题会自动收进来</span></div></div>`;
  let html=`<div class="wrap"><h2 class="sec" style="margin-top:6px">错题本 · ${keys.length} 题</h2>`;
  keys.forEach(k=>{
    const w=state.wrong[k];
    html+=`<div class="wrongitem">
      <div class="q"><div class="qt" style="font-size:13.5px">${w.q}</div>
      <div class="ans"><span class="no">你填/选:${w.type==='calc' ? ((w.chosen===undefined||w.chosen==='')?'(空)':w.chosen+(w.unit||'')) : w.options[w.chosen]}</span></div>
      <div class="ans"><span class="ok">正确:${w.type==='calc' ? (w.answer+(w.unit||'')) : w.options[w.answer]}</span></div>
      <div class="explain" style="display:block">💡 ${w.explain}</div>
      <button class="btn ghost" style="margin-top:8px;padding:7px 14px;font-size:12px" data-master="${k}">✓ 已掌握,移出</button>
      </div></div>`;
  });
  html+=`</div>`;
  return html;
}

/* -------- 记录 -------- */
function viewRecords(){
  const xp=totalXP();
  // 打卡日历:近 35 天
  const days=state.checkin.days||[];
  const set=new Set(days);
  let cal='';
  const today=new Date(); today.setHours(0,0,0,0);
  for(let i=34;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const on=set.has(iso); const isToday=i===0;
    cal+=`<div class="d ${on?'on':''} ${isToday?'today':''}">${d.getDate()}</div>`;
  }
  // 经验分布
  let xprows='';
  LEVELS.forEach(lv=>{
    const got=lv.tasks.filter((t,i)=>state.done[`L${lv.id}-${i}`]).reduce((a,t)=>a+t.xp,0);
    const total=lv.tasks.reduce((a,t)=>a+t.xp,0);
    xprows+=`<div class="xprow"><span class="name">Lv${lv.id} ${lv.title}</span>
      <div class="mini-bar" style="width:90px"><i style="width:${got/total*100}%"></i></div>
      <span class="muted" style="width:66px;text-align:right">${got}/${total}</span></div>`;
  });
  // 成就
  let ach='';
  ACHIEVEMENTS.forEach(a=>{
    const got=a.test(state);
    ach+=`<div class="ach ${got?'got':''}"><div class="ai">${a.ic}</div>
      <div><div class="an">${a.name}</div><div class="ad">${a.desc}</div></div></div>`;
  });
  return `<div class="wrap">
    <h2 class="sec" style="margin-top:6px">📊 我的成长</h2>
    <div class="hero" style="padding:16px">
      <div class="stat-grid" style="margin-top:0">
        <div class="stat"><b>${xp}</b><span>总经验值</span></div>
        <div class="stat"><b>${passedCount()}</b><span>通关数</span></div>
        <div class="stat"><b>${state.checkin.streak||0}</b><span>连续打卡</span></div>
      </div>
      <div class="stat-grid" style="margin-top:8px">
        <div class="stat"><b>${correctCount()}</b><span>答对题数</span></div>
        <div class="stat"><b>${Object.keys(state.wrong).length}</b><span>错题本</span></div>
        <div class="stat"><b>${(state.checkin.days||[]).length}</b><span>累计学习</span></div>
      </div>
    </div>
    <h2 class="sec">🗓️ 打卡日历(近 35 天)</h2>
    <div class="card" style="padding:12px"><div class="cal">${cal}</div></div>
    <h2 class="sec">📈 各关经验</h2>
    <div class="card" style="padding:8px 14px">${xprows}</div>
    <h2 class="sec">🏅 成就</h2>
    <div class="card" style="padding:6px 14px">${ach}</div>
    <div style="height:20px"></div>
  </div>`;
}

/* ==================== 知识库 ==================== */
let kbQuery='';
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function allKbItems(){ const out=[]; KNOWLEDGE.forEach(c=> c.items.forEach(it=> out.push({cat:c, it}))); return out; }
function kbMatch(it, q){ q=q.trim().toLowerCase(); if(!q) return true; return (it.t+' '+(it.kw||'')+' '+it.body).toLowerCase().includes(q); }
function kbRow(it, c){
  return `<div class="kbrow" data-go="article" data-p="${it.id}">
    <div class="kbt">${it.t}</div>
    <div class="kbc">${c.name}</div>
  </div>`;
}
function kbBody(){
  const q=kbQuery, flat=allKbItems();
  if(q.trim()){
    const hits=flat.filter(x=>kbMatch(x.it,q));
    return hits.length ? hits.map(x=>kbRow(x.it,x.cat)).join('')
      : `<div class="center-empty"><span class="ic">🔍</span>没找到「${esc(q)}」相关内容</div>`;
  }
  let b='';
  KNOWLEDGE.forEach(c=>{
    b += `<h2 class="sec">${c.icon} ${c.name}</h2><div class="card" style="padding:4px 16px">` + c.items.map(it=>kbRow(it,c)).join('') + `</div>`;
  });
  return b;
}
function viewKnowledge(){
  const total=allKbItems().length;
  return `<div class="wrap">
    <h2 class="sec" style="margin-top:6px">📚 知识库 · 共 ${total} 条</h2>
    <div class="kbsearch">
      <span>🔍</span>
      <input id="kbSearch" placeholder="搜索:星三角 / Modbus / 线径…" value="${esc(kbQuery)}">
      <button id="kbClear">✕</button>
    </div>
    <div id="kbList" style="margin-top:12px">${kbBody()}</div>
  </div>`;
}
function refreshKbList(){
  const list=document.getElementById('kbList'); if(!list) return;
  list.innerHTML=kbBody(); bindGo(list);
}
function viewArticle(id){
  let found=null;
  KNOWLEDGE.forEach(c=> c.items.forEach(it=>{ if(it.id===id) found={cat:c, it}; }));
  if(!found) return `<div class="wrap"><div class="center-empty">未找到</div></div>`;
  return `<div class="wrap">
    <div class="topbar">
      <button class="back" id="backBtn">‹</button>
      <div><div class="tt">${found.it.t}</div><div class="ts">${found.cat.icon} ${found.cat.name}</div></div>
    </div>
    <div class="teach" style="margin-top:6px">${teachHtml(found.it.body)}</div>
    <div style="height:20px"></div>
  </div>`;
}
function bindGo(scope){
  scope.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); go(el.dataset.go, Number(el.dataset.p)||el.dataset.p); });
  });
}

/* ==================== 事件绑定 ==================== */
function wire(){
  // 通用跳转
  bindGo(document);
  renderDiagrams();
  // 配色
  document.querySelectorAll('[data-pal]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.settings.palette=el.dataset.pal; applyPalette(); save(); render(); });
  });
  // 知识库搜索
  const kb=document.getElementById('kbSearch');
  if(kb){
    kb.addEventListener('input', ()=>{ kbQuery=kb.value; refreshKbList(); });
    const kc=document.getElementById('kbClear');
    if(kc) kc.addEventListener('click', ()=>{ kbQuery=''; kb.value=''; kb.focus(); refreshKbList(); });
  }
  const back=document.getElementById('backBtn');
  if(back) back.addEventListener('click', ()=> go(view==='quiz'?'detail':(view==='article'?'kb':'map'), viewParam));

  // 任务点击
  document.querySelectorAll('[data-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const lv=LEVELS.find(l=>l.id===viewParam);
      const i=Number(el.dataset.task);
      const key=`L${lv.id}-${i}`;
      const was=!!state.done[key];
      if(was) delete state.done[key]; else state.done[key]=true;
      const nowDone=levelDone(lv);
      save();
      if(!was){ sfxTask(); }
      render();
      if(!was && nowDone) setTimeout(()=> toast(`🏅 通关「${lv.title}」!`), 400);
    });
  });

  // 打卡
  const ci=document.getElementById('checkinBtn');
  if(ci) ci.addEventListener('click', doCheckin);

  // 设置
  const th=document.getElementById('toggleTheme');
  if(th) th.addEventListener('change', ()=>{ state.settings.theme = th.checked?'dark':'light'; applyTheme(); save(); });
  const ts=document.getElementById('toggleSound');
  if(ts) ts.addEventListener('change', ()=>{ state.settings.sound=ts.checked; save(); if(ts.checked) sfxTask(); });
  const tr=document.getElementById('toggleRemind');
  if(tr) tr.addEventListener('change', ()=> setRemind(tr.checked));

  // 存档
  const ex=document.getElementById('exportBtn');
  if(ex) ex.addEventListener('click', doExport);
  const im=document.getElementById('importBtn');
  if(im) im.addEventListener('click', ()=> document.getElementById('fileInput').click());
  const fi=document.getElementById('fileInput');
  if(fi) fi.addEventListener('change', doImport);
  const rs=document.getElementById('resetBtn');
  if(rs) rs.addEventListener('click', ()=>{
    if(confirm('确定清空所有进度?')){ state=load0(); save(); render(); toast('已重置'); }
  });

  // 测验选项
  document.querySelectorAll('[data-q]').forEach(el=>{
    if(quizSubmitted) return;
    el.addEventListener('click', ()=>{
      const qi=Number(el.dataset.q), oi=Number(el.dataset.o);
      quizSel[qi]=oi;
      render();
    });
  });
  // 计算题输入（不重绘，避免丢焦点）
  document.querySelectorAll('[data-calc]').forEach(inp=>{
    if(quizSubmitted) return;
    inp.addEventListener('input', ()=>{
      quizSel[Number(inp.dataset.calc)]=inp.value;
      updateQuizStatus();
    });
  });
  const qsub=document.getElementById('quizSubmit');
  if(qsub) qsub.addEventListener('click', submitQuiz);
  const qagain=document.getElementById('quizAgain');
  if(qagain) qagain.addEventListener('click', ()=>{ quizSel={}; quizSubmitted=false; refreshQuizOrder(viewParam); render(); });

  // 错题移出
  document.querySelectorAll('[data-master]').forEach(el=>{
    el.addEventListener('click', ()=>{ delete state.wrong[el.dataset.master]; save(); render(); toast('已移出错题本'); });
  });
}

/* ==================== 行为 ==================== */
function load0(){ return { done:{}, quiz:{}, wrong:{}, checkin:{last:null, streak:0, days:[]}, settings:state.settings, rankIdx:0 }; }

function doCheckin(){
  const t=todayISO();
  if(state.checkin.last===t) return;
  const gap=state.checkin.last?daysBetween(state.checkin.last,t):null;
  state.checkin.streak = (gap===1)? (state.checkin.streak+1) : 1;
  state.checkin.last=t;
  if(!state.checkin.days) state.checkin.days=[];
  if(!state.checkin.days.includes(t)) state.checkin.days.push(t);
  save(); render();
  toast(`🔥 打卡成功!连续 ${state.checkin.streak} 天`);
}

function setRemind(on){
  if(!on){ state.settings.remind=false; save(); render(); return; }
  if(!('Notification' in window)){ toast('此浏览器不支持通知'); render(); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted'){ state.settings.remind=true; save(); toast('已开启提醒(页面打开时生效)'); }
    else toast('未授权通知,无法提醒');
    render();
  });
}

function updateQuizStatus(){
  const lv=LEVELS.find(l=>l.id===viewParam); if(!lv) return;
  const answered=lv.quiz.filter((q,qi)=>{ const v=quizSel[qi]; return v!==undefined && v!=='' && v!==null; }).length;
  const btn=document.getElementById('quizSubmit');
  if(btn){ btn.disabled=answered<lv.quiz.length; btn.textContent=`交卷判分 (${answered}/${lv.quiz.length})`; }
}

function submitQuiz(){
  const lv=LEVELS.find(l=>l.id===viewParam);
  const qs=lv.quiz;
  const before=rankIndex(totalXP());
  quizSubmitted=true;
  let correct=0;
  qs.forEach((q,qi)=>{
    const chosen=quizSel[qi];
    const k=`L${lv.id}Q${qi}`;
    if(isCorrect(q,chosen)){ correct++; if(state.wrong[k]) delete state.wrong[k]; }
    else { state.wrong[k]={ q:q.q, type:q.type||'choice', options:q.options, answer:q.answer, unit:q.unit, chosen, explain:q.explain, lv:lv.id }; }
  });
  state.quiz[lv.id]={ attempted: qs.length, correct: correct };
  save(); render();
  const after=rankIndex(totalXP());
  if(after>before){ showLevelUp(after); } else { toast(correct===qs.length?'🎉 全对!'+` +${correct*8}XP`:`答对 ${correct}/${qs.length}`); }
}

function showLevelUp(idx){
  sfxLevel();
  const r=RANKS[idx];
  const el=document.getElementById('levelup');
  el.innerHTML=`<div class="box">
    <div class="big">${r.icon}</div>
    <div class="up1">境 界 提 升</div>
    <div class="up2">${r.name}</div>
    <div class="up3">累计 ${totalXP()} XP · 继续加油!</div>
    <button class="btn" id="luClose">太棒了</button>
  </div>`;
  el.classList.add('show');
  state.rankIdx=idx; save();
  document.getElementById('luClose').addEventListener('click', ()=> el.classList.remove('show'));
}

function doExport(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`电气养成存档_${todayISO()}.json`; a.click();
  URL.revokeObjectURL(a.href); toast('已导出存档');
}
function doImport(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.done) throw 0;
    state=o; if(!state.wrong) state.wrong={}; if(!state.quiz) state.quiz={};
    if(!state.checkin) state.checkin={last:null,streak:0,days:[]}; if(!state.settings) state.settings={sound:true,remind:false,theme:'light'}; if(!state.settings.theme) state.settings.theme='light'; if(!state.settings.palette) state.settings.palette='blue';
    save(); render(); toast('存档导入成功 ✓'); }catch(err){ toast('❌ 存档无效'); } };
  r.readAsText(f); e.target.value='';
}

/* ==================== Toast ==================== */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=> el.classList.remove('show'),1900);
}

/* ==================== 每日提醒调度 ==================== */
function scheduleReminder(){
  if(!state.settings.remind) return;
  if(state.checkin.last===todayISO()) return;
  if(document.hidden) return;
  if(Notification.permission==='granted'){
    const last=sessionStorage.getItem('ee_remind')||'';
    if(last!==todayISO()){
      new Notification('⚡ 电气工程师养成',{ body:'今天还没打卡,学 10 分钟也能涨经验!' });
      sessionStorage.setItem('ee_remind', todayISO());
    }
  }
}
setInterval(scheduleReminder, 60000);

/* ==================== 启动 ==================== */
applyTheme();
render();
</script>
